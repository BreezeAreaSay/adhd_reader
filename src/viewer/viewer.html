<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ADHD Reader</title>
    <link rel="icon" href="../../icons/icon32.png" />
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <main class="welcome" id="welcome" hidden>
      <header class="welcome-head">
        <img src="../../icons/icon48.png" width="40" height="40" alt="" />
        <div>
          <h1 data-i18n="extName">ADHD Reader</h1>
          <p data-i18n="viewerSubtitle"></p>
        </div>
      </header>
      <section class="drop" id="drop">
        <p class="drop-title" data-i18n="viewerDropTitle"></p>
        <p class="drop-hint" data-i18n="viewerDropHint"></p>
        <button type="button" class="primary" id="choose" data-i18n="viewerChoose">Choose a file</button>
        <p class="drop-note" id="welcome-note" hidden></p>
      </section>
      <section class="recent" id="recent" hidden>
        <h2 data-i18n="viewerRecent">Recent</h2>
        <ul id="recent-list"></ul>
      </section>
    </main>
    <input type="file" id="file-input" accept=".pdf,.epub,.fb2,.zip,.txt,application/pdf,application/epub+zip" hidden />

    <script src="../shared/settings.js"></script>
    <script src="../content/bionic.js"></script>
    <script src="../content/engine.js"></script>
    <script src="../content/font-faces.js"></script>
    <script src="../content/typography.js"></script>
    <script src="../content/overlay.js"></script>
    <script src="../shared/sanitize.js"></script>
    <script src="../shared/reading-view.js"></script>
    <script type="module" src="viewer.mjs"></script>
  </body>
</html>
